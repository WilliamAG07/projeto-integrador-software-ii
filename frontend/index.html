<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Gestão Integrada - PI II</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 40px; }
        .container { max-width: 600px; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin: auto; }
        h2 { color: #003366; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #003366; color: white; border: none; padding: 12px 20px; margin-top: 20px; cursor: pointer; border-radius: 4px; font-size: 16px; width: 100%; }
        button:hover { background-color: #002244; }
        .success { display: none; margin-top: 20px; padding: 15px; background-color: #d4edda; color: #155724; border-radius: 4px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>Painel de Controle - Solicitação de Serviços</h2>
    <form id="meuForm" onsubmit="event.preventDefault(); cadastrar();">
        <label for="cliente">Nome do Cliente:</label>
        <input type="text" id="cliente" placeholder="Digite o nome completo" required>

        <label for="servico">Descrição do Serviço:</label>
        <input type="text" id="servico" placeholder="Ex: Manutenção de Equipamento" required>

        <label for="valor">Valor (R$):</label>
        <input type="number" id="valor" step="0.01" placeholder="0.00" required>

        <button type="submit">Cadastrar Pedido no Sistema</button>
    </form>

    <div id="msgSucesso" class="success">✔ Pedido cadastrado com sucesso no banco de dados!</div>
</div>

<script>
    function cadastrar() {
        document.getElementById('msgSucesso').style.display = 'block';
        setTimeout(() => {
            document.getElementById('meuForm').reset();
        }, 800);
    }
</script>

</body>
</html>
